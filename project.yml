name: TensionMirror
options:
  bundleIdPrefix: local.tensionmirror
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  TensionMirror:
    type: application
    platform: [iOS, macOS]
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Tension Mirror uses Bluetooth to light up climbs on your physical Tension Board."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tensionmirror
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        "TARGETED_DEVICE_FAMILY[sdk=iphoneos*]": "1"
        "TARGETED_DEVICE_FAMILY[sdk=iphonesimulator*]": "1"
